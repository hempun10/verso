name: Deploy Backend (Hugging Face Spaces)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/huggingface/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Sync Backend to Hugging Face Space
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID || 'hempun10/verso' }}
      EDITPDF_ALLOWED_ORIGINS: ${{ vars.EDITPDF_ALLOWED_ORIGINS || 'https://tryverso.pages.dev' }}
      EDITPDF_AUTH_SECRET: ${{ secrets.EDITPDF_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: env.HF_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage Space files and deploy to Hugging Face Spaces
        if: env.HF_TOKEN != ''
        run: |
          python -m pip install --quiet huggingface_hub
          rm -rf /tmp/hf-space
          mkdir -p /tmp/hf-space/backend
          cp deploy/huggingface/Dockerfile /tmp/hf-space/Dockerfile
          cp deploy/huggingface/README.space.md /tmp/hf-space/README.md
          cp backend/pyproject.toml backend/uv.lock /tmp/hf-space/backend/
          cp -r backend/src backend/scripts /tmp/hf-space/backend/
          find /tmp/hf-space -name "__pycache__" -type d -exec rm -rf {} +

          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE_ID"]
          allowed_origins = os.environ["EDITPDF_ALLOWED_ORIGINS"]
          auth_secret = os.environ.get("EDITPDF_AUTH_SECRET", "").strip()
          sha = os.environ.get("GITHUB_SHA", "")[:7]

          api = HfApi(token=token)

          # Ensure the public Docker Space exists (idempotent if already created).
          api.create_repo(
              repo_id=space_id,
              repo_type="space",
              space_sdk="docker",
              private=False,
              exist_ok=True,
          )

          # Configure non-secret runtime variables before pushing so the Space boots with them.
          variables = {
              "EDITPDF_ALLOWED_ORIGINS": allowed_origins,
              "EDITPDF_TRUST_PROXY_HEADERS": "true",
              "EDITPDF_COOKIE_SECURE": "true",
              "EDITPDF_COOKIE_SAMESITE": "none",
              "EDITPDF_ENABLE_DEV_AUTH": "false",
          }
          if auth_secret:
              api.add_space_secret(repo_id=space_id, key="EDITPDF_AUTH_SECRET", value=auth_secret)
              variables["EDITPDF_ENV"] = "production"

          for key, value in variables.items():
              api.add_space_variable(repo_id=space_id, key=key, value=value)

          api.upload_folder(
              folder_path="/tmp/hf-space",
              repo_id=space_id,
              repo_type="space",
              delete_patterns=["backend/**"],
              commit_message=f"Deploy backend from GitHub ({sha})" if sha else "Deploy backend from GitHub",
          )
          print(f"Deployed to https://huggingface.co/spaces/{space_id}")
          PY

      - name: Skip deploy notice
        if: env.HF_TOKEN == ''
        run: |
          echo "Skipping Hugging Face Spaces deploy - set HF_TOKEN repository secret to enable auto-deploy."
