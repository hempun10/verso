name: Deploy Backend (AWS Lambda)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/aws-lambda/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Container to AWS Lambda
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      ECR_REPO: ${{ vars.AWS_ECR_REPO || 'verso-api' }}
      LAMBDA_FUNCTION: ${{ vars.AWS_LAMBDA_FUNCTION || 'verso-api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, push, and update Lambda container
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPO}:${GITHUB_SHA::7}"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --load \
            -f deploy/aws-lambda/Dockerfile \
            -t "$IMAGE_URI" \
            -t "${ECR_REGISTRY}/${ECR_REPO}:latest" \
            .
          docker push "$IMAGE_URI"
          docker push "${ECR_REGISTRY}/${ECR_REPO}:latest"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$IMAGE_URI" >/dev/null
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"

      - name: Skip deploy notice
        if: env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == ''
        run: |
          echo "Skipping AWS Lambda deploy - set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets to enable."
