name: Deploy Backend (AWS Lambda)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/aws-lambda/**"
      - ".github/workflows/deploy-backend-aws.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Container to AWS Lambda
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      ECR_REPO: verso-api
      LAMBDA_FUNCTION: verso-api
      LAMBDA_ROLE: verso-api-lambda-role
      EDITPDF_ALLOWED_ORIGINS: ${{ vars.EDITPDF_ALLOWED_ORIGINS || 'https://tryverso.pages.dev' }}
      EDITPDF_AUTH_SECRET: ${{ secrets.EDITPDF_AUTH_SECRET }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository and cleanup policy
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPO" --image-scanning-configuration scanOnPush=false >/dev/null
          aws ecr put-lifecycle-policy --repository-name "$ECR_REPO" --lifecycle-policy-text \
            '{"rules":[{"rulePriority":1,"description":"Keep last 2 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}' >/dev/null

      - name: Log in to Amazon ECR
        id: login-ecr
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda container image
        id: build-image
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --load \
            -f deploy/aws-lambda/Dockerfile \
            -t "$IMAGE_URI" \
            -t "${ECR_REGISTRY}/${ECR_REPO}:latest" \
            .
          docker push "$IMAGE_URI"
          docker push "${ECR_REGISTRY}/${ECR_REPO}:latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Create or update AWS Lambda function and Function URL
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${LAMBDA_ROLE}"

          if ! aws iam get-role --role-name "$LAMBDA_ROLE" >/dev/null 2>&1; then
            aws iam create-role \
              --role-name "$LAMBDA_ROLE" \
              --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}' >/dev/null
            aws iam attach-role-policy \
              --role-name "$LAMBDA_ROLE" \
              --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            sleep 12
          fi

          # Preserve any manually configured env vars (e.g. Appwrite or Turnstile) on existing Lambda.
          EXISTING_ENV=$(aws lambda get-function-configuration --function-name "$LAMBDA_FUNCTION" --query 'Environment.Variables' --output json 2>/dev/null || echo '{}')
          MERGED_ENV=$(python3 - "$EXISTING_ENV" <<'PY'
          import json, os, sys
          raw = sys.argv[1].strip()
          env = json.loads(raw) if raw and raw != "null" else {}
          env.update({
              "EDITPDF_ENV": "production",
              "EDITPDF_ENABLE_DEV_AUTH": "false",
              "EDITPDF_ALLOWED_ORIGINS": os.environ["EDITPDF_ALLOWED_ORIGINS"],
              "EDITPDF_TRUST_PROXY_HEADERS": "true",
              "EDITPDF_COOKIE_SECURE": "true",
              "EDITPDF_COOKIE_SAMESITE": "none",
              "EDITPDF_SESSIONS_DIR": "/tmp/verso-sessions",
              "EDITPDF_MAX_PDF_BYTES": "5000000",
              "EDITPDF_OCR_CONCURRENCY": "2",
          })
          for key in (
              "EDITPDF_AUTH_SECRET",
              "TURNSTILE_SITE_KEY",
              "TURNSTILE_SECRET_KEY",
              "APPWRITE_ENDPOINT",
              "APPWRITE_PROJECT_ID",
              "APPWRITE_API_KEY",
          ):
              val = os.environ.get(key, "").strip()
              if val:
                  env[key] = val
          print(json.dumps({"Variables": env}))
          PY
          )

          if aws lambda get-function --function-name "$LAMBDA_FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION" \
              --image-uri "$IMAGE_URI" >/dev/null
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
            aws lambda update-function-configuration \
              --function-name "$LAMBDA_FUNCTION" \
              --memory-size 2048 \
              --timeout 120 \
              --ephemeral-storage '{"Size": 1024}' \
              --environment "$MERGED_ENV" >/dev/null
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          else
            aws lambda create-function \
              --function-name "$LAMBDA_FUNCTION" \
              --package-type Image \
              --code "ImageUri=${IMAGE_URI}" \
              --role "$ROLE_ARN" \
              --architectures x86_64 \
              --memory-size 2048 \
              --timeout 120 \
              --ephemeral-storage '{"Size": 1024}' \
              --environment "$MERGED_ENV" >/dev/null
            aws lambda wait function-active-v2 --function-name "$LAMBDA_FUNCTION"
          fi

          FUNC_URL=$(aws lambda get-function-url-config --function-name "$LAMBDA_FUNCTION" --query FunctionUrl --output text 2>/dev/null || true)
          if [ -z "$FUNC_URL" ]; then
            FUNC_URL=$(aws lambda create-function-url-config \
              --function-name "$LAMBDA_FUNCTION" \
              --auth-type NONE \
              --invoke-mode BUFFERED \
              --query FunctionUrl \
              --output text)
          fi

          aws lambda add-permission \
            --function-name "$LAMBDA_FUNCTION" \
            --statement-id FunctionURLAllowPublicAccess \
            --action lambda:InvokeFunctionUrl \
            --principal "*" \
            --function-url-auth-type NONE >/dev/null 2>&1 || true

          aws lambda add-permission \
            --function-name "$LAMBDA_FUNCTION" \
            --statement-id FunctionURLInvokeFunction \
            --action lambda:InvokeFunction \
            --principal "*" \
            --invoked-via-function-url >/dev/null 2>&1 || true

          echo "=========================================="
          echo "LIVE LAMBDA URL: ${FUNC_URL%/}"
          echo "=========================================="

      - name: Skip deploy notice
        if: env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == ''
        run: |
          echo "Skipping AWS Lambda deploy - set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets to enable."
